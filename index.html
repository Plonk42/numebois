<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Smaller than the tablet (a phone): its 1280×800 layout, scaled down whole by the browser.
      if (innerWidth < 1280 || innerHeight < 720)
        document.querySelector('meta[name=viewport]').content =
          'width=' + Math.ceil(Math.max(1280, (800 * innerWidth) / innerHeight));
    </script>
    <meta name="theme-color" content="#9ed0ee" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Numebois</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9ed0ee;
        touch-action: none;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Warm light over the forest while it passes to its next stage. */
      #veil {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        background: radial-gradient(circle, #fffbe8 0 35%, rgba(255, 244, 200, 0.96) 100%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.4s ease-out;
      }
      #veil.on {
        opacity: 1;
        transition: opacity 0.7s ease-in;
      }
      /* A new season: the light alone. */
      #veil.quiet p {
        visibility: hidden;
      }
      #veil p {
        margin: 0;
        font:
          700 40px system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #a8740c;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
