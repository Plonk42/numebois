name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
      # Uploaded here, long before deploy-pages lists the run's artifacts; a rerun of deploy
      # publishes it again without adding a second one.
      - name: Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    name: e2e (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Software rendering keeps each runner busy: groups of similar length on parallel runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: game
            args: game.spec
          - group: notions
            args: notions.spec save.spec sound.spec
          - group: scene
            args: --grep-invert "(game|notions|save|sound)\.spec"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # The optimised KayKit models are committed; placeholders are tested with ?assets=placeholder.
      - name: Playwright (tablet landscape)
        run: npx playwright test ${{ matrix.args }}
      - name: Upload report and captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  gate:
    name: Delivery gate
    if: ${{ always() }}
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "checks: $CHECKS, e2e: $E2E"
          test "$CHECKS" = "success" && test "$E2E" = "success"

  deploy:
    name: deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
